name: 🏗️ 构建与发布（macOS & Windows）

run-name: ${{ github.ref_type == 'tag' && '🚀 发布' || '🔨 构建' }} QuickPaste · ${{ github.ref_name }}

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CMAKE_GENERATOR: Ninja

defaults:
  run:
    shell: bash

jobs:
  build-windows:
    name: 🪟 构建 Windows x64
    runs-on: windows-2022
    timeout-minutes: 120
    steps:
      - name: 📥 检出代码
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          persist-credentials: false

      - name: 🦀 安装 Rust 1.99.1
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.99.1"
          components: rustfmt,clippy
          targets: x86_64-pc-windows-msvc

      - name: 🏷️ 校验应用版本
        run: |
          VERSION="$(cargo metadata --no-deps --format-version 1 | python -c "import json,sys; d=json.load(sys.stdin); print(next((p['version'] for p in d['packages'] if p['name'] == 'quick-paste'), ''))")"
          if [ -z "$VERSION" ]; then
            echo "❌ Cargo 元数据中找不到 quick-paste 项目" >&2
            exit 1
          fi
          if [ "$GITHUB_REF_TYPE" = "tag" ] && [ "$GITHUB_REF_NAME" != "v$VERSION" ] && [ "$GITHUB_REF_NAME" != "$VERSION" ]; then
            echo "❌ 标签 $GITHUB_REF_NAME 与 Cargo.toml 版本 $VERSION 不一致" >&2
            exit 1
          fi
          echo "📌 版本：$VERSION"

      - name: 🛠️ 初始化 MSVC 编译环境
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: 💾 缓存 Cargo 构建
        uses: Swatinem/rust-cache@v2
        with:
          key: windows-x64

      - name: 🧪 格式、Clippy 与单元测试
        shell: pwsh
        run: |
          cargo fmt --check
          cargo clippy --all-targets -- -D warnings
          cargo test --release

      - name: 🔨 构建发布版
        shell: pwsh
        run: cargo build --release

      - name: 🩺 验证发布程序使用 Windows GUI 子系统
        shell: pwsh
        run: |
          $stream = [System.IO.File]::OpenRead("target/release/quick-paste.exe")
          try {
            $reader = [System.IO.BinaryReader]::new($stream)
            $stream.Position = 0x3c
            $peOffset = $reader.ReadInt32()
            $stream.Position = $peOffset
            if ($reader.ReadUInt32() -ne 0x4550) { throw '发布程序不是有效的 PE 文件' }
            $stream.Position = $peOffset + 24 + 68
            $subsystem = $reader.ReadUInt16()
            if ($subsystem -ne 2) {
              throw "发布程序未使用 Windows GUI 子系统，当前值：$subsystem"
            }
          } finally {
            $stream.Dispose()
          }

      - name: 📦 安装 cargo-packager
        shell: pwsh
        run: cargo install cargo-packager --version 0.11.8 --locked

      - name: 🧰 打包 setup 与 portable
        shell: pwsh
        run: ./scripts/package.ps1 -Arch x64 -PackageType both -SkipBuild

      - name: ⬆️ 上传 Windows 产物
        uses: actions/upload-artifact@v4
        with:
          name: quick-paste-windows-x64
          path: |
            target/packages/x86_64-pc-windows-msvc/*-setup.exe
            target/packages/x86_64-pc-windows-msvc/*-portable.zip
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  build-macos:
    name: 🍎 构建 macOS (${{ matrix.arch }})
    runs-on: macos-14
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            target: aarch64-apple-darwin
            run_tests: true
          - arch: x64
            target: x86_64-apple-darwin
            run_tests: false
    steps:
      - name: 📥 检出代码
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          persist-credentials: false

      - name: 🦀 安装 Rust 1.99.1
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.99.1"
          components: rustfmt,clippy
          targets: ${{ matrix.target }}

      - name: 💾 缓存 Cargo 构建
        uses: Swatinem/rust-cache@v2
        with:
          key: macos-${{ matrix.arch }}

      - name: 🧪 格式、Clippy 与单元测试
        if: matrix.run_tests
        run: |
          cargo fmt --check
          cargo clippy --all-targets -- -D warnings
          cargo test --release

      - name: 🔨 构建发布版 (${{ matrix.target }})
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: 🧰 打包 macOS .app / .dmg / .zip
        run: ./scripts/package-macos.sh --arch ${{ matrix.arch }} --skip-build

      - name: ⬆️ 上传 macOS 产物
        uses: actions/upload-artifact@v4
        with:
          name: quick-paste-macos-${{ matrix.arch }}
          path: |
            target/packages/${{ matrix.target }}/*.dmg
            target/packages/${{ matrix.target }}/*-app.zip
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  release:
    name: 🚀 发布 GitHub Release
    needs: [build-windows, build-macos]
    if: github.event_name == 'workflow_dispatch' && github.ref_type == 'tag'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: 📥 检出完整历史
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0
          persist-credentials: false

      - name: ⬇️ 下载全平台构建产物
        uses: actions/download-artifact@v4
        with:
          path: dist

      - name: 🧾 汇总并校验产物
        run: |
          set -euo pipefail
          mkdir -p release-assets
          find dist -type f \( -name '*.exe' -o -name '*.zip' -o -name '*.dmg' \) -exec cp {} release-assets/ \;
          ls -lh release-assets/
          count="$(ls -1 release-assets | wc -l | tr -d ' ')"
          if [ "$count" -ne 6 ]; then
            echo "❌ 发布产物数量错误，预期 6 个，实际 $count 个" >&2
            exit 1
          fi

      - name: 📝 生成发布说明
        run: |
          set -euo pipefail
          current_tag="$GITHUB_REF_NAME"
          prev_tag="$(git tag --sort=-version:refname | grep -v "^${current_tag}$" | head -n 1 || true)"
          if [ -n "$prev_tag" ]; then
            git log --pretty=format:'* %s (%h)' "$prev_tag..$current_tag" \
              -- . ':(exclude)docs' ':(exclude).github' ':(exclude).gitea' > release-notes.md
            if [ ! -s release-notes.md ]; then
              echo "本次发布没有需要列出的代码改动。" > release-notes.md
            fi
          else
            echo "首次发布。" > release-notes.md
          fi
          printf '\n' >> release-notes.md

      - name: 🚀 创建 GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          repo="$GITHUB_REPOSITORY"
          tag="$GITHUB_REF_NAME"
          prerelease="false"
          if [[ "${tag%%+*}" == *-* ]]; then
            prerelease="true"
          fi
          if gh release view "$tag" --repo "$repo" >/dev/null 2>&1; then
            echo "❌ 已存在 Release $tag，拒绝覆盖" >&2
            exit 1
          fi
          gh release create "$tag" --repo "$repo" --verify-tag --prerelease="$prerelease" --title "$tag" --notes-file release-notes.md release-assets/*
